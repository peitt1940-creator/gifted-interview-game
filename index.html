<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>資優班街頭採訪隊</title>
<style>
:root{--teal:#3fb39b;--teal-d:#2b8f7b;--teal-l:#e3f5f0;--navy:#1d4e89;--ink:#1f2933;--mute:#6b7280;--bg:#f4f8f7;--card:#fff;--line:#d8e3e0;--warn:#e0583b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:none}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 40px}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:18px;margin:0;font-weight:700}
.clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:10px}
.clock.low{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.btn{background:var(--teal);color:#fff;padding:12px 22px;border-radius:12px;font-size:17px;font-weight:700}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.small{padding:8px 14px;font-size:15px}
.muted{color:var(--mute)}
h2{font-size:22px;margin:4px 0 10px;color:var(--navy)}
h3{font-size:18px;margin:0 0 8px}
p{line-height:1.7;margin:6px 0}
/* 教師頁 */
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.qrcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.qrcard .g{font-size:20px;font-weight:800;color:var(--navy)}
.qrcard svg{width:100%;max-width:220px;height:auto;margin:8px auto;display:block}
.qrcard a{font-size:13px;color:var(--teal-d);word-break:break-all}
.bigclock{font-size:72px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--navy);margin:4px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* 場景 */
.scene{background:linear-gradient(180deg,var(--teal-l),#fff);border-radius:18px;padding:16px;border:1px solid var(--line)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.person{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;position:relative}
.person .av{font-size:46px;line-height:1.1}
.person .nm{font-weight:800;font-size:17px;margin-top:4px}
.person .nt{font-size:13px;color:var(--mute);min-height:2.6em}
.person .st{font-size:13px;margin-top:6px;font-weight:700;color:var(--mute)}
.person.done{border-color:var(--teal)}
.person.done .st{color:var(--teal-d)}
/* 訪問 */
.who{display:flex;align-items:center;gap:14px}
.who .av{font-size:64px}
.qa{margin:14px 0;border-top:1px dashed var(--line);padding-top:12px}
.qbtn{width:100%;text-align:left;background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;font-size:17px;font-weight:700}
.qbtn.asked{background:#e8eef6;color:var(--navy)}
.bubble{background:#fff7e6;border:2px solid #f2c675;border-radius:4px 16px 16px 16px;padding:12px 14px;margin:10px 0 8px 22px;font-size:18px;line-height:1.6}
.bubble.anim{animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tagask{font-size:14px;color:var(--mute);margin:6px 0 6px 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-left:22px}
.chip{border:2px solid var(--c);color:var(--c);background:#fff;padding:7px 12px;border-radius:999px;font-size:15px;font-weight:700}
.chip.on{background:var(--c);color:#fff}
.clue{background:#eef6ff;border:2px solid #b8d4f0;border-radius:14px;padding:12px 14px;margin-top:12px}
.clue li{margin:6px 0;line-height:1.6}
.sel textarea,.concl textarea{width:100%;min-height:80px;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:2px solid var(--line);margin-top:6px}
.hint{font-size:14px;color:var(--mute)}
.lockmsg{background:#fdecea;color:#9b2c1d;padding:8px 12px;border-radius:10px;font-weight:700;margin:8px 0}
/* 統計 */
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar .lb{width:120px;font-weight:700;font-size:15px;flex:none}
.bar .tr{flex:1;background:#eef2f1;border-radius:8px;height:26px;overflow:hidden}
.bar .fl{height:100%;border-radius:8px;transition:width .5s}
.bar .n{width:34px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
table.rec{width:100%;border-collapse:collapse;font-size:15px}
table.rec td,table.rec th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.rec th{color:var(--mute);font-weight:700;font-size:13px}
.mini{display:inline-block;color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;margin:1px 2px}
.src li{margin:8px 0;line-height:1.6;font-size:14px}
.src a{color:var(--teal-d);word-break:break-all}
.overlay{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.overlay .box{background:#fff;border-radius:20px;padding:26px;text-align:center;max-width:380px}
.overlay .box .big{font-size:48px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;color:var(--mute);text-decoration:underline;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;

<script>
// ===== 入口積木：依網址參數決定教師頁或組別頁 =====
const params = new URLSearchParams(location.search);
const G = params.get('g');
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GAME_MIN = 8;

// ===== 記憶積木：每台裝置各自存，四組互不干擾 =====
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function fmt(ms){ ms = Math.max(0, ms); const s = Math.ceil(ms/1000); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }

if (G && GROUPS[G]) groupApp(G); else teacherApp();

// ================= 教師頁 =================
function teacherApp(){
  const base = location.href.split('?')[0].split('#')[0];
  let t = store.get('zyp-teacher', { running:false, endAt:0, left: GAME_MIN*60000 });
  app.innerHTML = `
    <div class="top"><h1>資優班街頭採訪隊｜教師頁</h1><span class="muted" style="color:#cfe0f2">各組掃自己的 QR code</span></div>
    <div class="wrap">
      <div class="card">
        <div class="bigclock" id="tclock">08:00</div>
        <div class="row">
          <button class="btn" id="tstart">開始計時</button>
          <button class="btn ghost" id="treset">重設 8 分鐘</button>
        </div>
        <p class="hint" style="text-align:center;margin-top:10px">各組平板有自己的 8 分鐘倒數（按下「開始訪問」才起算），這裡的計時給全班看。</p>
      </div>
      <div class="qrgrid" id="qrs"></div>
      <div class="card">
        <h3>使用方式</h3>
        <p>1. 投影這一頁，每組用一台平板掃自己那組的 QR code。</p>
        <p>2. 四組訪問的對象不同：第1組家長、第2組低年級學生、第3組中高年級學生、第4組社會人士。</p>
        <p>3. 紀錄只存在各組自己的平板，各組同時進行互不干擾。重新整理頁面不會清掉紀錄。</p>
        <p>4. 下一個班級要用時，在各組平板的「統計」頁最下方按「清除本組紀錄」。</p>
      </div>
    </div>`;
  const box = document.getElementById('qrs');
  Object.keys(GROUPS).forEach(k => {
    const url = base + '?g=' + k;
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const d = document.createElement('div'); d.className = 'qrcard';
    d.innerHTML = `<div class="g">第${k}組</div><div class="muted">訪問：${esc(GROUPS[k].who)}</div>${qr.createSvgTag({cellSize:6, margin:2, scalable:true})}<a href="${esc(url)}" target="_blank">${esc(url)}</a>`;
    box.appendChild(d);
  });
  const clock = document.getElementById('tclock'), bs = document.getElementById('tstart');
  function draw(){
    const left = t.running ? t.endAt - Date.now() : t.left;
    clock.textContent = fmt(left);
    clock.style.color = left <= 60000 ? 'var(--warn)' : 'var(--navy)';
    bs.textContent = t.running ? '暫停' : (t.left < GAME_MIN*60000 ? '繼續' : '開始計時');
    if (t.running && left <= 0){ t = { running:false, endAt:0, left:0 }; store.set('zyp-teacher', t); }
  }
  bs.onclick = () => {
    if (t.running){ t = { running:false, endAt:0, left: Math.max(0, t.endAt - Date.now()) }; }
    else if (t.left > 0){ t = { running:true, endAt: Date.now() + t.left, left: t.left }; }
    store.set('zyp-teacher', t); draw();
  };
  document.getElementById('treset').onclick = () => { t = { running:false, endAt:0, left: GAME_MIN*60000 }; store.set('zyp-teacher', t); draw(); };
  draw(); setInterval(draw, 250);
}

// ================= 組別頁 =================
function groupApp(g){
  const grp = GROUPS[g];
  const KEY = 'zyp-g' + g;
  const blank = () => ({ startAt:0, endAt:0, rec:{}, concl:'', view:'intro', pid:null });
  let S = store.get(KEY, blank());
  const save = () => store.set(KEY, S);
  const rec = pid => (S.rec[pid] = S.rec[pid] || { a1:false, a2:false, t1:[], t2:[], clue:false, sel:'' });
  const timeUp = () => S.endAt && Date.now() >= S.endAt;
  const personDone = p => { const r = S.rec[p.id]; return r && r.a1 && r.a2 && r.t1.length && r.t2.length; };
  let ticker = null, shownUp = false, justAsked = null;

  function shell(inner, showClock = true){
    app.innerHTML = `<div class="top"><h1>${esc(grp.title)}</h1>${showClock && S.startAt ? '<span class="clock" id="clk">--:--</span>' : ''}</div><div class="wrap">${inner}</div>`;
    tick();
  }
  function tick(){
    const c = document.getElementById('clk');
    if (c){ const left = S.endAt - Date.now(); c.textContent = fmt(left); c.classList.toggle('low', left <= 60000); }
    if (timeUp() && !shownUp && S.view !== 'results' && S.view !== 'sources'){
      shownUp = true;
      const o = document.createElement('div'); o.className = 'overlay';
      o.innerHTML = `<div class="box"><div class="big">⏰</div><h2>時間到！</h2><p>訪問結束，一起看看你們收集到什麼。</p><button class="btn" id="goR">看統計</button></div>`;
      document.body.appendChild(o);
      o.querySelector('#goR').onclick = () => { o.remove(); go('results'); };
    }
  }
  function go(view, pid){ S.view = view; if (pid !== undefined) S.pid = pid; save(); render(); window.scrollTo(0,0); }

  function render(){
    ({ intro, scene, person, results, sources })[S.view in { intro:1, scene:1, person:1, results:1, sources:1 } ? S.view : 'intro']();
  }

  // ---- 開場 ----
  function intro(){
    if (S.startAt){ return go('scene'); }
    shell(`
      <div class="card" style="text-align:center">
        <div style="font-size:56px">🎤</div>
        <h2>${esc(grp.title)}</h2>
        <p>今天你們是「資優班街頭採訪隊」，要到 <b>${esc(grp.scene)}</b> 訪問 ${grp.people.length} 位${esc(grp.who)}。</p>
      </div>
      <div class="card">
        <h3>任務規則</h3>
        <p>1. 點一位受訪者，問他兩個問題。</p>
        <p>2. 每聽完一個回答，替這句話貼 1～2 張標籤：你們覺得這句話背後是什麼原因？</p>
        <p>3. 兩題都貼好標籤，就能打開「線索」。看完線索，可以回頭改標籤。</p>
        <p>4. 時間只有 <b>${GAME_MIN} 分鐘</b>，分工合作，盡量訪問每一位。</p>
        <div class="row" style="margin-top:10px">${TAGS.map(t => `<span class="mini" style="background:${t.color};font-size:14px;padding:4px 10px">${t.name}</span>`).join('')}</div>
      </div>
      <div class="row"><button class="btn" id="start">開始訪問（${GAME_MIN} 分鐘）</button></div>`, false);
    document.getElementById('start').onclick = () => { S.startAt = Date.now(); S.endAt = S.startAt + GAME_MIN*60000; go('scene'); };
  }

  // ---- 場景 ----
  function scene(){
    const done = grp.people.filter(personDone).length;
    shell(`
      <div class="scene">
        <h2>${esc(grp.scene)}</h2>
        <p class="muted">已完成 ${done} / ${grp.people.length} 位。點一位開始訪問。</p>
        <div class="people">
          ${grp.people.map(p => { const r = S.rec[p.id]; const n = r ? (r.a1?1:0)+(r.a2?1:0) : 0;
            return `<button class="person ${personDone(p)?'done':''}" data-p="${p.id}">
              <div class="av">${p.avatar}</div><div class="nm">${esc(p.name)}</div><div class="nt">${esc(p.note)}</div>
              <div class="st">${personDone(p) ? '✓ 完成' : (n ? `已問 ${n} 題` : '還沒訪問')}</div></button>`; }).join('')}
        </div>
      </div>
      <div class="row" style="margin-top:16px"><button class="btn ghost" id="toR">結束訪問，看統計</button></div>`);
    app.querySelectorAll('.person').forEach(b => b.onclick = () => go('person', b.dataset.p));
    document.getElementById('toR').onclick = () => go('results');
  }

  // ---- 訪問 ----
  function person(){
    const p = grp.people.find(x => x.id === S.pid); if (!p) return go('scene');
    const r = rec(p.id); const locked = timeUp();
    const qs = [ ['a1','t1','你覺得資優班在做什麼？'], ['a2','t2', grp.q2] ];
    const tagged = r.a1 && r.a2 && r.t1.length && r.t2.length;
    shell(`
      <button class="btn ghost small" id="back">← 回到${esc(grp.scene.replace(/^\S+\s/,''))}</button>
      <div class="card">
        <div class="who"><div class="av">${p.avatar}</div><div><h2 style="margin:0">${esc(p.name)}</h2><div class="muted">${esc(p.note)}</div></div></div>
        ${locked ? '<div class="lockmsg">時間到了，標籤已經不能修改。</div>' : ''}
        ${qs.map(([a,t,q],i) => `
          <div class="qa">
            <button class="qbtn ${r[a]?'asked':''}" data-a="${a}" ${locked && !r[a] ? 'disabled' : ''}>🎤 問題${i+1}：${esc(q)}</button>
            ${r[a] ? `<div class="bubble ${justAsked===a?'anim':''}">${esc(p[a])}</div>
              <div class="tagask">這句話背後是什麼原因？（選 1～2 張）</div>
              <div class="chips">${TAGS.map(tg => `<button class="chip ${r[t].includes(tg.id)?'on':''}" style="--c:${tg.color}" data-t="${t}" data-id="${tg.id}" ${locked?'disabled':''}>${tg.name}</button>`).join('')}</div>` : ''}
          </div>`).join('')}
        ${tagged ? (r.clue ? `
          <div class="clue"><h3>🔍 線索</h3><ul>${p.clues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
          <div class="hint">看完線索，想改標籤可以直接點上面的標籤。</div></div>
          ${p.sel ? `<div class="sel card" style="margin-top:12px"><h3>💬 ${esc(p.sel)}</h3><textarea id="sel" placeholder="寫下你們想說的話" ${locked?'disabled':''}>${esc(r.sel)}</textarea></div>` : ''}`
          : `<div class="row" style="margin-top:12px"><button class="btn" id="clue">🔍 打開線索</button></div>`)
          : `<p class="hint" style="margin-top:12px">兩題都問完、都貼好標籤，就能打開線索。</p>`}
      </div>`);
    document.getElementById('back').onclick = () => go('scene');
    app.querySelectorAll('.qbtn').forEach(b => b.onclick = () => { if (locked) return; justAsked = r[b.dataset.a] ? null : b.dataset.a; r[b.dataset.a] = true; save(); person(); justAsked = null; });
    app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      if (locked) return; const arr = r[b.dataset.t], id = b.dataset.id, i = arr.indexOf(id);
      if (i >= 0) arr.splice(i,1); else { if (arr.length >= 2) arr.shift(); arr.push(id); }
      save(); person();
    });
    const cb = document.getElementById('clue'); if (cb) cb.onclick = () => { r.clue = true; save(); person(); };
    const sel = document.getElementById('sel'); if (sel) sel.oninput = () => { r.sel = sel.value; save(); };
  }

  // ---- 統計 ----
  function results(){
    const cnt = Object.fromEntries(TAGS.map(t => [t.id, 0]));
    grp.people.forEach(p => { const r = S.rec[p.id]; if (!r) return; [...r.t1, ...r.t2].forEach(id => cnt[id]++); });
    const max = Math.max(1, ...Object.values(cnt));
    const asked = grp.people.filter(p => S.rec[p.id] && (S.rec[p.id].a1 || S.rec[p.id].a2));
    const tagHtml = ids => ids.map(id => { const t = TAGS.find(x => x.id === id); return `<span class="mini" style="background:${t.color}">${t.name}</span>`; }).join('') || '<span class="muted">（沒貼）</span>';
    shell(`
      <div class="card">
        <h2>📊 我們這組的標籤統計</h2>
        <p class="muted">訪問對象：${esc(grp.who)}｜訪問了 ${asked.length} / ${grp.people.length} 位</p>
        ${TAGS.map(t => `<div class="bar"><div class="lb" style="color:${t.color}">${t.name}</div><div class="tr"><div class="fl" style="width:${cnt[t.id]/max*100}%;background:${t.color}"></div></div><div class="n">${cnt[t.id]}</div></div>`).join('')}
      </div>
      <div class="card">
        <h2>📝 訪問紀錄</h2>
        <table class="rec"><tr><th>受訪者</th><th>他說了什麼</th><th>標籤</th></tr>
        ${asked.map(p => { const r = S.rec[p.id]; return [['a1','t1'],['a2','t2']].filter(([a]) => r[a]).map(([a,t],i) =>
          `<tr><td>${i===0 ? `${p.avatar} ${esc(p.name)}` : ''}</td><td>${esc(p[a])}</td><td>${tagHtml(r[t])}</td></tr>`).join('')
          + (r.sel ? `<tr><td></td><td colspan="2" class="muted">💬 我們想對${esc(p.name)}說：${esc(r.sel)}</td></tr>` : ''); }).join('') || '<tr><td colspan="3" class="muted">還沒有紀錄</td></tr>'}
        </table>
      </div>
      <div class="card concl">
        <h2>💡 我們的發現</h2>
        <p>看著上面的統計和紀錄討論：哪一張標籤最多？這些${esc(grp.who)}為什麼會這樣想？寫下你們自己的結論，等一下跟其他組比較。</p>
        <textarea id="concl" placeholder="我們發現……">${esc(S.concl)}</textarea>
      </div>
      <div class="foot">
        <button class="btn ghost" id="toS">📚 資料出處</button>
        ${timeUp() ? '' : '<button class="btn ghost" id="toScene">回去繼續訪問</button>'}
      </div>
      <div class="foot"><span></span><button class="linkbtn" id="clr">清除本組紀錄（換下一班時使用）</button></div>`);
    const c = document.getElementById('concl'); c.oninput = () => { S.concl = c.value; save(); };
    document.getElementById('toS').onclick = () => go('sources');
    const bs = document.getElementById('toScene'); if (bs) bs.onclick = () => go('scene');
    const clr = document.getElementById('clr'); let armed = false;
    clr.onclick = () => {
      if (!armed){ armed = true; clr.textContent = '確定要清除？再按一次'; clr.style.color = 'var(--warn)'; setTimeout(() => { armed = false; clr.textContent = '清除本組紀錄（換下一班時使用）'; clr.style.color = ''; }, 4000); return; }
      store.del(KEY); S = blank(); shownUp = false; render();
    };
  }

  // ---- 出處 ----
  function sources(){
    const ids = [...new Set(grp.people.flatMap(p => p.src))].sort((a,b) => a-b);
    shell(`
      <div class="card">
        <h2>📚 資料出處</h2>
        <p>受訪者的台詞是依下面這些資料改寫成口語，有些是依資料內容設計的情境；線索裡的規定、數字和研究結果都來自這些資料。</p>
        <ol class="src">${ids.map(i => `<li>${esc(SOURCES[i][0])}<br><a href="${esc(SOURCES[i][1])}" target="_blank" rel="noopener">${esc(SOURCES[i][1])}</a></li>`).join('')}</ol>
      </div>
      <div class="row"><button class="btn ghost" id="toR">← 回到統計</button></div>`);
    document.getElementById('toR').onclick = () => go('results');
  }

  render();
  ticker = setInterval(tick, 250);
}
</script>
</body>
</html>
